name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Publish verified release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Check tag and integration version match
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('custom_components/wanneeraanzetten/manifest.json').read_text())['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag must match manifest version'
          PY
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python scripts/build_release.py
      - name: Extract release notes
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('CHANGELOG.md').read_text().split('## ', 1)[1]
          notes = text.split('\n', 1)[1].split('\n## ', 1)[0].strip()
          Path('dist/RELEASE_NOTES.md').write_text(notes + '\n')
          PY
      - name: Publish GitHub release and installation files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/wanneeraanzetten.zip dist/SHA256SUMS --verify-tag --title "Wanneer Aanzetten $RELEASE_TAG" --notes-file dist/RELEASE_NOTES.md
