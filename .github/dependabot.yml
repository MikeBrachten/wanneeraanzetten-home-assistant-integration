version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
    groups:
      home-assistant-test-runtime:
        patterns:
          - homeassistant
          - pytest-homeassistant-custom-component
    open-pull-requests-limit: 5
