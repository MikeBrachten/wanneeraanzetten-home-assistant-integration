name: Bug report
description: Report an integration problem with reproducible details.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include passwords, access tokens, recovery codes, or private account information. Report security issues privately.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: 2026.10.2
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: market
    attributes:
      label: Electricity market
      placeholder: NL
  - type: textarea
    id: behavior
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant redacted logs
      render: text
